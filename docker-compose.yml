# Standard local dependencies (requires Docker). The repo also supports an npm-bundled
# embedded PostgreSQL via `npm run db:start` for environments without Docker.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hiregari
      POSTGRES_PASSWORD: hiregari
      POSTGRES_DB: hiregari
    ports:
      - '5432:5432'
    volumes:
      - ./.pgdata-docker:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hiregari']
      interval: 5s
      timeout:5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - ./.redis-data:/data
